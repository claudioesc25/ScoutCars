<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoutCars</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
      <header>
        <nav class="navegador">
        <div class="Titulo">ScoutCars</div>
        <div class="Menu">
          <a href="/">Inicio</a>
          <a href="/productos.html">Productos</a>
          <a class="activo" href="/login.html">Mi cuenta</a>
        </div>
      </nav>
  </header>
  <main>
    <div class="split">
      <section class="card">
        <h2>Iniciar sesión</h2>
        <form id="login-form" class="simple">
          <div>
            <label for="login-email">Correo</label>
            <input id="login-email" name="email" type="email" placeholder="ej: usuario@correo.com" required>
          </div>
          <div>
            <label for="login-pass">Clave</label>
            <input id="login-pass" name="password" type="password" placeholder="•••••••" required>
          </div>
          <button class="btn" type="submit">Entrar</button>
        </form>
      </section>

      <section class="card registro">
        <h2>Registrarse</h2>
        <form id="register-form" class="simple">
          <div>
            <label for="reg-name">Nombre</label>
            <input id="reg-name" name="name" type="text" placeholder="Nombre y apellido" required>
          </div>
          <div>
            <label for="reg-email">Correo</label>
            <input id="reg-email" name="email" type="email" placeholder="ej: usuario@correo.com" required>
          </div>
          <div>
            <label for="reg-phone">Teléfono</label>
            <input id="reg-phone" name="phone" type="tel" placeholder="+56 9 1234 5678">
          </div>
          <div>
            <label for="reg-pass">Clave</label>
            <input id="reg-pass" name="password" type="password" placeholder="•••••••" required>
          </div>
          <button class="btn" type="submit">Crear cuenta</button>
    
        </form>
      </section>
    </div>
  </main>
   <footer>
    © 2026 ScoutCars. Todos los derechos reservados.
  </footer>
  </body>
</html>
